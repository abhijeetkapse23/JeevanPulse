<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F28C28">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>JeevanPulse – Daily Check-in & Medicine Care</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EF;--card:#fff;--ink:#2B2118;--muted:#7A6A5B;--line:#EFE3D3;
  --saffron:#F28C28;--saffron-d:#D9731A;--green:#1F9D6B;--green-l:#E3F6EE;
  --red:#D64545;--red-l:#FDECEC;--amber:#E9A400;--amber-l:#FFF5D6;--grey-l:#F2ECE4;--blue-l:#E8F0FF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans','Noto Sans Devanagari',sans-serif;background:#EDE3D6;color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:88px}
header{padding:18px 18px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px;color:var(--saffron-d);line-height:1;display:flex;align-items:center;gap:6px}
.brand svg{flex-shrink:0}
.brand small{display:block;font-family:'Noto Sans',sans-serif;font-weight:400;font-size:12px;color:var(--muted);margin-top:4px}
select.lang{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--ink);cursor:pointer}
.wa.call{background:var(--red)}
.banner.esc{background:#FFE1E1;border:2px solid var(--red)}
.emf{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;opacity:.4;cursor:pointer;font-size:15px}.emf.on{opacity:1;border-color:var(--red);background:var(--red-l)}
.clock{margin:0 18px 12px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.demo{display:flex;gap:6px}
.demo button{border:1px dashed var(--muted);background:transparent;border-radius:8px;padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer}
section{padding:0 18px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 0 var(--line),0 4px 14px rgba(120,80,30,.06)}
h2{font-family:'Baloo 2',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px;font-weight:700}
h3:first-of-type{margin-top:0}
/* Pulse */
.pulse-card{text-align:center;padding:22px 16px}
.ok-btn{width:180px;height:180px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#3DC48F,var(--green));color:#fff;font-family:'Baloo 2',sans-serif;font-size:24px;font-weight:800;line-height:1.1;cursor:pointer;box-shadow:0 10px 30px rgba(31,157,107,.35),inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .1s;animation:beat 2.4s ease-in-out infinite}
.ok-btn:active{transform:scale(.96)}
.ok-btn span{display:block;font-size:13px;font-weight:500;opacity:.9;margin-top:4px;font-family:'Noto Sans','Noto Sans Devanagari'}
@keyframes beat{0%,100%{box-shadow:0 10px 30px rgba(31,157,107,.35),0 0 0 0 rgba(31,157,107,.3)}50%{box-shadow:0 10px 30px rgba(31,157,107,.35),0 0 0 16px rgba(31,157,107,0)}}
.pulse-done{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--green-l);border:4px solid var(--green);color:var(--green);font-family:'Baloo 2';font-weight:800;font-size:20px;line-height:1.15}
.pulse-done small{display:block;font-family:'Noto Sans','Noto Sans Devanagari';font-weight:600;font-size:12px}
.pulse-wait{width:150px;height:150px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--amber-l);border:4px dashed var(--amber);color:#8A6200;font-weight:700;font-size:14px;padding:16px;line-height:1.35}
.ok-note{margin-top:14px;font-size:14px;color:var(--muted);line-height:1.45}
.manual-link{margin-top:10px;background:none;border:1.5px solid var(--green);color:var(--green);border-radius:20px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
/* banners */
.banner{border-radius:14px;padding:14px;margin-bottom:14px;background:var(--red-l);border:1.5px solid #F5C2C2}
.banner.amber{background:var(--amber-l);border-color:#F2D98A}
.banner b{color:var(--red)}.banner.amber b{color:#8A6200}
.banner p{font-size:14px;margin:4px 0 10px}
.wa{display:inline-flex;align-items:center;gap:6px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px;margin:0 6px 6px 0}
/* meds */
.med{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.med.first,.list>.med:first-child{border-top:none}
.pill{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--amber-l)}
.med-info{flex:1;min-width:0}
.med-name{font-weight:700;font-size:15px}
.med-sub{font-size:12px;color:var(--muted);line-height:1.4}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;margin-top:4px}
.t-up{background:var(--grey-l);color:var(--muted)}.t-due{background:var(--amber-l);color:#9A6B00}.t-ok{background:var(--green-l);color:var(--green)}.t-miss{background:var(--red-l);color:var(--red)}.t-late{background:#FFE9D6;color:#B55A00}
.chk{width:44px;height:44px;border-radius:50%;border:2.5px solid #D9CCBC;background:#fff;font-size:20px;cursor:pointer;flex-shrink:0;color:transparent;display:grid;place-items:center}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk.late{background:#F0A050;border-color:#F0A050;color:#fff}
.chk.alert{border-color:var(--red)}
.big-btn{width:100%;border:none;background:var(--saffron);color:#fff;font-weight:700;border-radius:14px;padding:14px;font-size:16px;cursor:pointer;margin-top:12px;font-family:inherit}
.big-btn:disabled{background:#EDE6DD;color:#A9998A;cursor:default}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit}
.row{display:flex;gap:8px;margin-top:10px}
input,select{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px;font-size:15px;font-family:inherit;background:#FFFCF8;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--saffron)}
.flabel{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 -4px}
.days{display:flex;gap:5px;margin-top:10px}
.days button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 0;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.days button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.add{border:none;background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font-weight:700;font-size:20px;cursor:pointer}
.del{border:none;background:none;color:#B9A898;font-size:18px;cursor:pointer;padding:4px}
.empty{font-size:14px;color:var(--muted);padding:6px 0;line-height:1.5}
.refill{display:flex;gap:10px;align-items:center;background:var(--blue-l);border-radius:14px;padding:12px;margin-bottom:14px;font-size:14px}
/* history */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcell{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;border:2px solid transparent;position:relative}
.dcell small{font-size:9px;font-weight:600;opacity:.75}
.dcell .hp{position:absolute;top:2px;right:4px;font-size:9px}
.c-ok{background:var(--green-l);color:var(--green)}.c-late{background:#FFE9D6;color:#B55A00}.c-miss{background:var(--red-l);color:var(--red)}.c-none{background:var(--grey-l);color:var(--muted)}.c-today{border-color:var(--saffron)!important}
.dcell.sel{border-color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.insight{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.insight:first-child{border-top:none}
/* family */
.fstatus{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;margin-top:8px}
.fstatus .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex-shrink:0;background:#fff}
.fstatus b{display:block;font-size:15px}.fstatus span{font-size:12px;color:var(--muted)}
.s-green{background:var(--green-l)}.s-amber{background:var(--amber-l)}.s-red{background:var(--red-l)}.s-grey{background:var(--grey-l)}
.adh{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--grey-l);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:8px}
.alert-item{padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.alert-item:first-child{border-top:none}
.alert-item time{display:block;font-size:12px;color:var(--muted);margin-top:2px}
/* settings */
.mode{border:2px solid var(--line);border-radius:14px;padding:12px;margin-top:10px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.mode.on{border-color:var(--saffron);background:#FFF3E6}
.mode .rd{width:20px;height:20px;border-radius:50%;border:2px solid #CDBFAE;flex-shrink:0;margin-top:2px}
.mode.on .rd{border:6px solid var(--saffron)}
.mode b{display:block;font-size:15px}.mode span{font-size:13px;color:var(--muted);line-height:1.4}
.setting{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);gap:12px}
.setting label{font-size:14px;flex:1;line-height:1.35}
.setting label small{display:block;color:var(--muted);font-size:12px}
.setting input,.setting select{flex:0 0 120px}
.tog{width:48px;height:28px;border-radius:20px;background:#D9CCBC;border:none;position:relative;cursor:pointer;flex-shrink:0;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on::after{left:23px}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 4px 12px;z-index:5}
nav button{flex:1;border:none;background:none;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;position:relative}
nav button .ic{font-size:21px}
nav button.on{color:var(--saffron-d);font-weight:700}
.dot{position:absolute;top:-2px;right:22%;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:1px 5px;font-weight:700}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}
.seg{display:flex;background:var(--grey-l);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:none;padding:7px 10px;border-radius:9px;font-weight:700;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><svg width="28" height="28" viewBox="0 0 28 28"><path d="M14 24s-9-5.6-9-12.2A5 5 0 0 1 14 8.6a5 5 0 0 1 9 3.2C23 18.4 14 24 14 24z" fill="#F28C28"/><path d="M6 14h4l2-3 3 6 2-3h5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div>JeevanPulse<small id="tagline"></small></div></div>
    <select class="lang" id="langSel"><option value="en">English</option><option value="hi">हिंदी</option><option value="mr">मराठी</option></select>
  </header>
  <div class="clock"><span id="clockTxt"></span>
    <div class="demo"><button id="ff"></button><button id="rs"></button></div>
  </div>

  <!-- HOME (Quick) -->
  <div id="v-home" class="view"><section>
    <div id="alertBanners"></div>
    <div class="card pulse-card" id="pulseCard"></div>
    <div id="refills"></div>
    <div class="card" id="quickCard"></div>
  </section></div>

  <!-- MEDICINES (Deep) -->
  <div id="v-meds" class="view hidden"><section>
    <div class="card" id="medsOff"></div>
    <div id="medsOn">
      <div class="card"><h2 id="hMeds"></h2><div class="list" id="medList"></div></div>
      <div class="card">
        <h2 id="hForm"></h2>
        <input id="mName">
        <div class="row"><input id="mTime" type="time" value="09:00" style="flex:0 0 120px"><input id="mDose"></div>
        <p class="flabel" id="lFood"></p>
        <div class="row"><select id="mFood"></select></div>
        <p class="flabel" id="lDays"></p>
        <div class="days" id="mDays"></div>
        <p class="flabel" id="lStock"></p>
        <div class="row"><input id="mStock" type="number" min="0" inputmode="numeric"></div>
        <div class="row"><button class="big-btn" id="mSave" style="margin-top:4px"></button></div>
        <div class="row"><button class="ghost hidden" id="mCancel" style="flex:1"></button></div>
      </div>
    </div>
  </section></div>

  <!-- HISTORY (Deep) -->
  <div id="v-history" class="view hidden"><section>
    <div class="card">
      <h2><span id="hHist"></span></h2>
      <div class="cal" id="cal"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card" id="dayDetail"></div>
    <div class="card"><h2 id="hIns"></h2><div id="insights"></div></div>
  </section></div>

  <!-- FAMILY -->
  <div id="v-family" class="view hidden"><section>
    <div class="card"><h2 id="hFamView"></h2><p class="hint" id="famViewHint" style="margin:-6px 0 4px"></p><div id="famStatus"></div></div>
    <div class="card">
      <h2 id="hFam"></h2>
      <div class="list" id="famList"></div>
      <div class="row"><input id="fName"><select id="fRel" style="flex:0 0 110px"></select></div>
      <div class="row"><input id="fPhone" type="tel" placeholder="98XXXXXXXX"><button class="add" id="fAdd">+</button></div>
      <div class="setting" style="border-top:none;padding:10px 0 0"><label id="lEmerg"></label><button class="tog" id="tEmerg"></button></div>
      <p class="hint" id="famHint"></p>
    </div>
    <div class="card"><h2 id="hAlerts"></h2><div id="alertList"></div></div>
  </section></div>

  <!-- SETTINGS -->
  <div id="v-settings" class="view hidden"><section>
    <div class="card">
      <h2 id="hMode"></h2>
      <div class="mode" data-mode="pulse"><div class="rd"></div><div><b id="mPulseT"></b><span id="mPulseD"></span></div></div>
      <div class="mode" data-mode="combined"><div class="rd"></div><div><b id="mCombT"></b><span id="mCombD"></span></div></div>
      <div class="setting" style="margin-top:8px" id="manualRow"><label id="lManual"></label><button class="tog" id="tManual"></button></div>
    </div>
    <div class="card">
      <h2 id="hSet"></h2>
      <div class="setting" style="border-top:none"><label id="lUser"></label><input id="sUser"></div>
      <div class="setting"><label id="lDeadline"></label><input id="sDeadline" type="time"></div>
      <div class="setting"><label id="lGrace"></label>
        <select id="sGrace"><option>15</option><option>30</option><option>45</option><option>60</option><option>90</option><option>120</option></select></div>
      <div class="setting"><label id="lEsc"></label><select id="sEsc"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option></select></div>
      <p class="hint" id="setHint"></p>
    </div>
  </section></div>

  <nav>
    <button data-v="home" class="on"><span class="ic">🏠</span><span data-t="navHome"></span></button>
    <button data-v="meds"><span class="ic">💊</span><span data-t="navMeds"></span></button>
    <button data-v="history"><span class="ic">📅</span><span data-t="navHist"></span></button>
    <button data-v="family"><span class="ic">👨‍👩‍👧</span><span data-t="navFam"></span><span class="dot hidden" id="alertDot"></span></button>
    <button data-v="settings"><span class="ic">⚙️</span><span data-t="navSet"></span></button>
  </nav>
  <div class="toast" id="toast"></div>
</div>

<script>
const T={

/* ---------- state ---------- */
const NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const KEY="jeevanpulse_v2";
const LOC={en:"en-IN",hi:"hi-IN",mr:"mr-IN"};
const ALL=[0,1,2,3,4,5,6];
function baseMeds(){return[
 {id:1,name:"BP tablet (Amlodipine)",time:"08:30",dose:"1 tablet",food:"after",days:ALL.slice(),stock:24},
 {id:2,name:"Sugar tablet (Metformin)",time:"13:30",dose:"1 tablet",food:"after",days:ALL.slice(),stock:4},
 {id:3,name:"Vitamin D",time:"21:00",dose:"1 capsule",food:"with",days:[0,3],stock:""},
 {id:4,name:"Calcium",time:"21:00",dose:"1 tablet",food:"after",days:ALL.slice(),stock:40}]}
function defaults(){const s={lang:"en",offset:0,user:"Papa",deadline:"10:00",grace:30,escHours:2,mode:"combined",manualBtn:false,
  meds:baseMeds(),family:[],checkins:{},taken:{},alerts:[]};if(!NATIVE)seed(s);return s}
function seed(s){ // sample history for the demo
  const base=new Date();
  const plan={1:{late:[4,9]},2:{miss:[6],late:[11]},3:{miss:[]},4:{miss:[2,5,7],late:[3]}};
  for(let i=1;i<=13;i++){
    const d=new Date(base);d.setDate(d.getDate()-i);const k=dk(d);s.taken[k]={};
    s.meds.forEach(m=>{if(!m.days.includes(d.getDay()))return;const p=plan[m.id]||{};
      if((p.miss||[]).includes(i))return;
      const due=atOn(d,m.time),late=(p.late||[]).includes(i);
      s.taken[k][m.id]=due.getTime()+(late?(95+i*3)*60000:(i*7%25-5)*60000);});
    if(i===8) s.taken[k]={}; // one quiet day, no meds logged
    if(i%4===0) s.checkins[k]=atOn(d,"07:40").getTime();
  }
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
if(!S.escHours)S.escHours=2;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queueNotifs()}
/* ---------- phone reminders (Android app only) ---------- */
let _nq=null,_lastSig="";
function queueNotifs(){if(!NATIVE)return;clearTimeout(_nq);_nq=setTimeout(scheduleNotifs,800)}
async function scheduleNotifs(){
  const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;if(!LN)return;
  const sig=JSON.stringify([S.lang,S.mode,S.deadline,S.manualBtn,S.meds.map(m=>[m.id,m.name,m.time,m.dose,m.food,m.days])]);
  if(sig===_lastSig)return;_lastSig=sig;
  try{
    const perm=await LN.requestPermissions();if(perm.display!=="granted")return;
    const pend=await LN.getPending();if(pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const l=L(),list=[];let id=1;
    if(S.mode==="combined")S.meds.forEach(m=>{const [h,mi]=m.time.split(":").map(Number);
      const days=m.days.length===7?[null]:m.days;
      days.forEach(dw=>list.push({id:id++,title:l.nMedT,body:l.nMedB(m.name,m.dose,l.food[m.food]),
        schedule:{on:dw===null?{hour:h,minute:mi}:{weekday:dw+1,hour:h,minute:mi},allowWhileIdle:true}}))});
    if(S.mode==="pulse"||S.manualBtn||!S.meds.length){let [h,mi]=S.deadline.split(":").map(Number);let t=h*60+mi-60;if(t<0)t=0;
      list.push({id:900,title:l.nPulseT,body:l.nPulseB,schedule:{on:{hour:Math.floor(t/60),minute:t%60},allowWhileIdle:true}})}
    if(list.length)await LN.schedule({notifications:list});
  }catch(e){console.log("notif",e)}
}

/* ---------- helpers ---------- */
const L=()=>T[S.lang];
function now(){return new Date(Date.now()+(S?S.offset:0))}
function dk(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function atOn(d,hm){const [h,m]=hm.split(":").map(Number);const x=new Date(d);x.setHours(h,m,0,0);return x}
const fmt=hm=>{const [h,m]=hm.split(":").map(Number);return((h%12)||12)+":"+String(m).padStart(2,"0")+(h<12?" AM":" PM")};
const fmtD=d=>fmt(d.getHours()+":"+d.getMinutes());
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slotOf=hm=>{const h=+hm.split(":")[0];return h<12?"m":h<17?"a":"n"};
const qty=m=>parseFloat(m.dose)||1;
const sortT=a=>[...a].sort((x,y)=>x.time.localeCompare(y.time));
const dayAgo=i=>{const d=now();d.setDate(d.getDate()-i);return d};
const medsOn=d=>S.mode==="combined"?sortT(S.meds.filter(m=>m.days.includes(d.getDay()))):[];

function statusOn(m,d,isToday){
  const k=dk(d),t=(S.taken[k]||{})[m.id],due=atOn(d,m.time),lim=due.getTime()+S.grace*60000;
  if(t)return{s:t<=lim?"ok":"late",t,lim};
  if(isToday){const n=now().getTime();if(n<due.getTime())return{s:"up",lim};if(n<lim)return{s:"due",lim};}
  return{s:"miss",lim};
}
function pulseOn(d){ // earliest of manual tap or (combined) any med logged
  const k=dk(d);let best=null;
  if(S.checkins[k])best={t:S.checkins[k],via:L().viaTap};
  if(S.mode==="combined"){const tk=S.taken[k]||{};
    S.meds.forEach(m=>{const t=tk[m.id];if(t&&(!best||t<best.t))best={t,via:L().viaMed(m.name.split(" (")[0])}});}
  return best;
}
function pulseDeadline(){
  let d=atOn(now(),S.deadline);
  const tm=medsOn(now());
  if(tm.length){const lim=new Date(atOn(now(),tm[0].time).getTime()+S.grace*60000);if(lim>d)d=lim}
  return d;
}
const showManual=()=>S.mode==="pulse"||S.manualBtn||medsOn(now()).length===0;

/* ---------- alerts ---------- */
function checkAlerts(){
  const d=now(),k=dk(d);let ch=false;const has=key=>S.alerts.some(a=>a.key===key);
  if(!pulseOn(d)&&d>pulseDeadline()&&!has(k+"|pulse")){S.alerts.unshift({key:k+"|pulse",type:"pulse",d:fmtD(pulseDeadline()),ts:d.getTime(),k});ch=true}
  if(!pulseOn(d)&&d.getTime()>pulseDeadline().getTime()+S.escHours*3600000&&!has(k+"|esc")){S.alerts.unshift({key:k+"|esc",type:"esc",d:fmtD(pulseDeadline()),h:S.escHours,ts:d.getTime(),k});ch=true}
  medsOn(d).forEach(m=>{if(statusOn(m,d,true).s==="miss"&&!has(k+"|"+m.id)){S.alerts.unshift({key:k+"|"+m.id,type:"med",id:m.id,m:m.name,t:m.time,ts:d.getTime(),k});ch=true}});
  if(ch)save();
}
const alertText=a=>a.type==="esc"?L().alEsc(a.h):a.type==="pulse"?L().alPulse(a.d):L().alMed(a.m,fmt(a.t));
const waMsg=a=>a.type==="esc"?L().msgEsc(S.user,a.d,a.h):a.type==="pulse"?L().msgPulse(S.user,a.d):L().msgMed(S.user,a.m,fmt(a.t));
function waLink(p,msg){let n=p.replace(/\D/g,"");if(n.length===10)n="91"+n;return"https://wa.me/"+n+"?text="+encodeURIComponent(msg)}
const telNum=p=>{let n=p.replace(/\D/g,"");if(n.length===10)n="91"+n;return"+"+n};
function waButtons(a){
  if(a.type==="esc"){const em=S.family.filter(f=>f.emergency);const l=L();
    let h=em.length?em.map(f=>`<a class="wa" target="_blank" rel="noopener" href="${waLink(f.phone,waMsg(a))}">💬 ${esc(l.sendWa(f.name))}</a><a class="wa call" href="tel:${telNum(f.phone)}">📞 ${esc(l.call(f.name))} · ${esc(f.phone)}</a>`).join(""):`<p style="font-size:13px;color:var(--red);margin-bottom:8px">${l.noEmerg}</p>`;
    return h+`<a class="wa call" href="tel:112">📞 ${l.call112}</a>`}
  if(!S.family.length)return`<p style="font-size:13px;color:var(--muted)">${L().addFamFirst}</p>`;
  return S.family.map(f=>`<a class="wa" target="_blank" rel="noopener" href="${waLink(f.phone,waMsg(a))}">💬 ${esc(L().sendWa(f.name))}</a>`).join("");
}
function openAlertsToday(){
  const d=now(),k=dk(d),p=pulseOn(d);
  return S.alerts.filter(a=>a.k===k&&!((a.type==="pulse"||a.type==="esc")&&p)&&!(a.type==="med"&&(S.taken[k]||{})[a.id]));
}

/* ---------- render ---------- */
let selDay=0,editId=null,formDays=ALL.slice(),newEmerg=false;
function render(){
  checkAlerts();
  const l=L(),d=now();
  document.documentElement.lang=S.lang;

  $("tagline").textContent=l.tagline;$("ff").textContent=l.ff;$("rs").textContent=l.rs;

  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=l[e.dataset.t]);

function renderHome(){
  const l=L(),d=now(),p=pulseOn(d),tm=medsOn(d),dl=fmtD(pulseDeadline());
  // banners
  const pr={esc:0,pulse:1,med:2};const open=openAlertsToday().sort((x,y)=>pr[x.type]-pr[y.type]);
  $("alertBanners").innerHTML=open.map(a=>`<div class="banner ${a.type==="esc"?"esc":""}"><b>${a.type==="esc"?l.escT:"⚠️ "+l.bannerT}</b><p>${esc(alertText(a))}</p>${waButtons(a)}</div>`).join("");
  // pulse card
  let h="";
  if(p){h=`<div class="pulse-done"><div>♥ ${l.pulseDone}<small>${fmtD(new Date(p.t))} · ${esc(p.via)}</small></div></div><div class="ok-note">${l.noteDone}</div>`}
  else if(S.mode==="pulse"||tm.length===0){h=`<button class="ok-btn" data-pulse>${l.pulseBtn}<span>${l.pulseBtnSub}</span></button><div class="ok-note">${l.noteTap(dl)}</div>`}
  else{h=`<div class="pulse-wait">${l.pulseWaitMed}</div><div class="ok-note">${l.noteMed(dl)}</div>${S.manualBtn?`<button class="manual-link" data-pulse>♥ ${l.manualTap}</button>`:""}`}
  $("pulseCard").innerHTML=h;
  // refills
  $("refills").innerHTML=S.mode==="combined"?S.meds.filter(m=>m.stock!==""&&m.stock!=null).map(m=>{const dl=daysLeft(m);return dl<=5?`<div class="refill">🧾 <span>${l.refill(esc(m.name),dl)}</span></div>`:""}).join(""):"";
  // quick
  const qc=$("quickCard");
  if(S.mode!=="combined"){qc.classList.add("hidden");return}
  qc.classList.remove("hidden");
  if(!S.meds.length){qc.innerHTML=`<h2>${l.quickT}</h2><p class="empty">${l.noMedsAtAll}</p>`;return}
  if(!tm.length){qc.innerHTML=`<h2>${l.quickT}</h2><p class="empty">${l.noMedsToday}</p>`;return}
  let out=`<h2>${l.quickT}</h2>`,pending=0;
  ["m","a","n"].forEach(s=>{const g=tm.filter(m=>slotOf(m.time)===s);if(!g.length)return;
    out+=`<h3>${l.slots[s]}</h3><div class="list">`+g.map(m=>{const st=statusOn(m,d,true);if(st.s!=="ok"&&st.s!=="late")pending++;
      const tag=st.s==="ok"?`<span class="tag t-ok">${l.tagOk(fmtD(new Date(st.t)))}</span>`:st.s==="late"?`<span class="tag t-late">${l.tagLate(fmtD(new Date(st.t)))}</span>`:st.s==="due"?`<span class="tag t-due">${l.tagDue(fmtD(new Date(st.lim)))}</span>`:st.s==="miss"?`<span class="tag t-miss">${l.tagMiss}</span>`:`<span class="tag t-up">${l.tagUp(fmt(m.time))}</span>`;
      const cls=st.s==="ok"?"on":st.s==="late"?"late":st.s==="miss"?"alert":"";
      return`<div class="med"><div class="med-info"><div class="med-name">${esc(m.name)}</div><div class="med-sub">${esc(m.dose)} · ${l.food[m.food]}</div>${tag}</div><button class="chk ${cls}" data-take="${m.id}" aria-label="taken">✓</button></div>`}).join("")+`</div>`});
  out+=pending?`<button class="big-btn" data-all>${l.tookAll}</button>`:`<p class="empty" style="margin-top:10px;text-align:center">${l.allDone}</p>`;
  qc.innerHTML=out;
}
function daysLeft(m){const perWeek=m.days.length||7;const perDay=qty(m)*perWeek/7;return Math.max(0,Math.floor(m.stock/perDay))}

function renderMeds(){
  const l=L();
  $("medsOff").classList.toggle("hidden",S.mode==="combined");$("medsOn").classList.toggle("hidden",S.mode!=="combined");
  $("medsOff").innerHTML=`<h2>${l.medsOffT}</h2><p class="empty">${l.medsOffD}</p><button class="big-btn" data-goset>${l.goSet}</button>`;
  $("hMeds").innerHTML=`${l.hMeds}`;
  const ms=sortT(S.meds);
  $("medList").innerHTML=ms.length?`<p class="hint" style="margin:-6px 0 4px">${l.editHint}</p>`+ms.map(m=>{
    const days=m.days.length===7?l.everyday:m.days.map(x=>l.dayL[x]).join(", ");
    const stock=(m.stock!==""&&m.stock!=null)?` · ${l.stockLeft(m.stock,daysLeft(m))}`:"";
    return`<div class="med" data-edit="${m.id}" style="cursor:pointer"><div class="pill">💊</div><div class="med-info"><div class="med-name">${esc(m.name)}</div><div class="med-sub">${fmt(m.time)} · ${esc(m.dose)} · ${l.food[m.food]}<br>${days}${stock}</div></div><button class="del" data-delm="${m.id}">✕</button></div>`}).join(""):`<p class="empty">${l.noMedsAtAll}</p>`;
  $("hForm").textContent=editId?l.hFormEdit:l.hFormAdd;
  $("mName").placeholder=l.mName;$("mDose").placeholder=l.mDose;$("lFood").textContent=l.lFood;$("lDays").textContent=l.lDays;$("lStock").textContent=l.lStock;
  const fv=$("mFood").value||"after";$("mFood").innerHTML=Object.keys(l.food).map(k=>`<option value="${k}">${l.food[k]}</option>`).join("");$("mFood").value=fv;
  $("mDays").innerHTML=l.dayN.map((n,i)=>`<button class="${formDays.includes(i)?"on":""}" data-day="${i}">${n}</button>`).join("");
  $("mSave").textContent=l.save;$("mCancel").textContent=l.cancel;$("mCancel").classList.toggle("hidden",!editId);

function dayStatus(d,isToday){
  const ms=medsOn(d).map(m=>({m,st:statusOn(m,d,isToday)}));
  const done=ms.filter(x=>x.st.s!=="up"&&x.st.s!=="due");
  let c="none";
  if(done.length){c=done.some(x=>x.st.s==="miss")?"miss":done.some(x=>x.st.s==="late")?"late":"ok"}
  return{ms,c};
}
function renderHistory(){
  const l=L();$("hHist").textContent=l.hHist;$("hIns").textContent=l.hIns;
  let cells="";
  for(let i=13;i>=0;i--){const d=dayAgo(i),{c}=dayStatus(d,i===0),p=pulseOn(d);
    cells+=`<div class="dcell c-${c} ${i===0?"c-today":""} ${selDay===i?"sel":""}" data-day-sel="${i}">${p?'<span class="hp">♥</span>':""}${d.getDate()}<small>${l.dayL[d.getDay()]}</small></div>`}
  $("cal").innerHTML=cells;
  const lg=l.legend;$("legend").innerHTML=`<span><i style="background:var(--green-l);border:1px solid var(--green)"></i>${lg[0]}</span><span><i style="background:#FFE9D6;border:1px solid #F0A050"></i>${lg[1]}</span><span><i style="background:var(--red-l);border:1px solid var(--red)"></i>${lg[2]}</span><span><i style="background:var(--grey-l)"></i>${lg[3]}</span><span>${lg[4]}</span>${NATIVE?"":`<span style="flex-basis:100%">${l.sample}</span>`}`;
  // detail
  const d=dayAgo(selDay),{ms}=dayStatus(d,selDay===0),p=pulseOn(d);
  const title=selDay===0?l.today:d.toLocaleDateString(LOC[S.lang],{weekday:"long",day:"numeric",month:"short"});
  let det=`<h2>${title}</h2><p style="font-size:14px;font-weight:700;color:${p?"var(--green)":"var(--red)"};margin-bottom:6px">${p?l.pulseAt(fmtD(new Date(p.t)),esc(p.via)):l.noPulse}</p>`;
  det+=ms.length?`<div class="list">`+ms.map(({m,st})=>{const lab={ok:l.stOk,late:l.stLate,miss:l.stMiss,up:l.stUp,due:l.stDue}[st.s];const cls={ok:"t-ok",late:"t-late",miss:"t-miss",up:"t-up",due:"t-due"}[st.s];
    return`<div class="med"><div class="med-info"><div class="med-name">${esc(m.name)}</div><div class="med-sub">${l.slots[slotOf(m.time)]} · ${fmt(m.time)}${st.t?" → "+fmtD(new Date(st.t)):""}</div></div><span class="tag ${cls}">${lab}</span></div>`}).join("")+`</div>`:`<p class="empty">${l.noMedsToday}</p>`;
  $("dayDetail").innerHTML=det;
  // insights
  const ins=[];
  if(S.mode==="combined"){
    S.meds.forEach(m=>{let miss=0,late=0;for(let i=1;i<=7;i++){const d=dayAgo(i);if(!m.days.includes(d.getDay()))continue;const s=statusOn(m,d,false).s;if(s==="miss")miss++;if(s==="late")late++}
      if(miss>=2)ins.push(`<div class="insight">🔴<span>${l.insMiss(esc(m.name),l.slots[slotOf(m.time)],miss)}</span></div>`);
      else if(late>=2)ins.push(`<div class="insight">🟠<span>${l.insLate(esc(m.name),late)}</span></div>`)});
  }
  let pc=0;for(let i=1;i<=7;i++)if(pulseOn(dayAgo(i)))pc++;
  ins.push(`<div class="insight">♥<span>${l.insPulse(pc)}</span></div>`);
  if(ins.length===1)ins.unshift(`<div class="insight">🌼<span>${l.insGood}</span></div>`);
  $("insights").innerHTML=ins.join("");
}

function adherence(){let tot=0,ok=0;for(let i=1;i<=7;i++){const d=dayAgo(i);medsOn(d).forEach(m=>{tot++;const s=statusOn(m,d,false).s;if(s==="ok")ok++;else if(s==="late")ok+=.5})}return tot?Math.round(ok/tot*100):null}
function renderFamily(){
  const l=L(),d=now(),p=pulseOn(d),tm=medsOn(d);
  $("hFamView").textContent=l.hFamView;$("famViewHint").textContent=l.famViewHint;
  const row=(cls,ic,[a,b])=>`<div class="fstatus ${cls}"><div class="ic">${ic}</div><div><b>${a}</b><span>${b}</span></div></div>`;
  let h="";
  const dl=fmtD(pulseDeadline());
  const escA=openAlertsToday().find(a=>a.type==="esc");
  h+=p?row("s-green","♥",l.fsPulseOn(fmtD(new Date(p.t)))):escA?row("s-red","🚨",l.fsEsc(escA.h)):d>pulseDeadline()?row("s-red","⚠️",l.fsPulseMiss(dl)):row("s-grey","⏳",l.fsPulseWait(dl));
  if(S.mode==="combined"){
    if(!tm.length)h+=row("s-grey","💊",l.fsNoMeds);
    else{const st=tm.map(m=>({m,s:statusOn(m,d,true)}));
      const miss=st.filter(x=>x.s.s==="miss"),due=st.filter(x=>x.s.s==="due"),up=st.filter(x=>x.s.s==="up");
      if(miss.length)h+=row("s-red","💊",l.fsOver(miss.map(x=>esc(x.m.name)+" ("+fmt(x.m.time)+")").join(", ")));
      if(due.length)h+=row("s-amber","⏰",l.fsPending(l.slots[slotOf(due[0].m.time)]));
      if(!miss.length&&!due.length)h+=up.length?row("s-green","💊",l.fsUpcoming(fmt(up[0].m.time))):row("s-green","✅",l.fsAll);
    }
    const a=adherence();if(a!==null)h+=`<div class="adh"><span>${l.adh(a)}</span><div class="bar"><i style="width:${a}%"></i></div></div>`;
  }
  $("famStatus").innerHTML=h;
  $("hFam").textContent=l.hFam;$("lEmerg").innerHTML=l.lEmerg;$("tEmerg").classList.toggle("on",newEmerg);$("fName").placeholder=l.fName;$("famHint").textContent=l.famHint;
  const rv=$("fRel").selectedIndex;$("fRel").innerHTML=l.rels.map(r=>`<option>${r}</option>`).join("");if(rv>0)$("fRel").selectedIndex=rv;
  $("famList").innerHTML=S.family.length?S.family.map((f,i)=>`<div class="med"><div class="pill" style="background:var(--blue-l)">👤</div><div class="med-info"><div class="med-name">${esc(f.name)}</div><div class="med-sub">${esc(f.rel)} · ${esc(f.phone)}</div>${f.emergency?`<span class="tag t-miss">${l.emergTag}</span>`:""}</div><button class="emf ${f.emergency?"on":""}" data-emf="${i}" aria-label="emergency">🚨</button><button class="del" data-delf="${i}">✕</button></div>`).join(""):`<p class="empty">${l.noFam}</p>`;
  $("hAlerts").textContent=l.hAlerts;
  $("alertList").innerHTML=S.alerts.length?S.alerts.slice(0,30).map(a=>`<div class="alert-item">⚠️ ${esc(alertText(a))}<time>${new Date(a.ts).toLocaleString(LOC[S.lang],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</time><div style="margin-top:8px">${waButtons(a)}</div></div>`).join(""):`<p class="empty">${l.noAlerts}</p>`;
  const n=openAlertsToday().length;$("alertDot").textContent=n;$("alertDot").classList.toggle("hidden",!n);
}

function renderSettings(){
  const l=L();
  ["hMode","mPulseT","mPulseD","mCombT","mCombD","hSet","lUser","setHint"].forEach(id=>$(id).textContent=l[id]);
  $("lManual").innerHTML=l.lManual;$("lDeadline").textContent=l.lDeadline;$("lGrace").innerHTML=l.lGrace;
  document.querySelectorAll(".mode").forEach(e=>e.classList.toggle("on",e.dataset.mode===S.mode));
  $("manualRow").classList.toggle("hidden",S.mode!=="combined");
  $("tManual").classList.toggle("on",!!S.manualBtn);
  if(document.activeElement!==$("sUser"))$("sUser").value=S.user;
  $("sDeadline").value=S.deadline;$("sGrace").value=String(S.grace);$("sEsc").value=String(S.escHours);$("lEsc").innerHTML=l.lEsc;
}

/* ---------- actions ---------- */
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function go(v){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));document.querySelectorAll(".view").forEach(x=>x.classList.toggle("hidden",x.id!=="v-"+v));window.scrollTo(0,0)}
function take(id,on){const k=dk(now());S.taken[k]=S.taken[k]||{};const m=S.meds.find(x=>x.id==id);
  if(on&&!S.taken[k][id]){S.taken[k][id]=now().getTime();if(m&&m.stock!==""&&m.stock!=null)m.stock=Math.max(0,m.stock-qty(m))}
  else if(!on&&S.taken[k][id]){delete S.taken[k][id];if(m&&m.stock!==""&&m.stock!=null)m.stock+=qty(m)}}
function resetForm(){editId=null;formDays=ALL.slice();$("mName").value="";$("mDose").value="";$("mStock").value="";$("mTime").value="09:00";$("mFood").value="after"}

document.body.addEventListener("click",e=>{
  const t=e.target;let x;
  if(x=t.closest("[data-pulse]")){S.checkins[dk(now())]=now().getTime();save();render();toast(L().tPulse);return}
  if(x=t.closest("[data-take]")){const k=dk(now()),was=(S.taken[k]||{})[x.dataset.take];const hadPulse=!!pulseOn(now());take(x.dataset.take,!was);save();render();toast(was?L().tUndo:(!hadPulse&&pulseOn(now())?L().tPulse:L().tTaken));return}
  if(x=t.closest("[data-all]")){medsOn(now()).forEach(m=>take(m.id,true));save();render();toast(L().tAll);return}
  if(x=t.closest("[data-delm]")){e.stopPropagation();S.meds=S.meds.filter(m=>m.id!=x.dataset.delm);if(editId==x.dataset.delm)resetForm();save();render();return}
  if(x=t.closest("[data-edit]")){const m=S.meds.find(m=>m.id==x.dataset.edit);editId=m.id;formDays=m.days.slice();$("mName").value=m.name;$("mTime").value=m.time;$("mDose").value=m.dose;$("mFood").value=m.food;$("mStock").value=m.stock??"";render();$("hForm").scrollIntoView({behavior:"smooth"});return}
  if(x=t.closest("[data-day]")){const i=+x.dataset.day;formDays=formDays.includes(i)?formDays.filter(v=>v!==i):[...formDays,i].sort();renderMeds();return}
  if(x=t.closest("[data-emf]")){const f=S.family[+x.dataset.emf];f.emergency=!f.emergency;save();render();return}
  if(x=t.closest("[data-delf]")){S.family.splice(+x.dataset.delf,1);save();render();return}
  if(x=t.closest("[data-day-sel]")){selDay=+x.dataset.daySel;renderHistory();return}
  if(x=t.closest("[data-goset]")){go("settings");return}
  if(x=t.closest(".mode")){S.mode=x.dataset.mode;save();render();return}
  if(x=t.closest("nav button")){go(x.dataset.v);return}
});
$("mSave").onclick=()=>{const n=$("mName").value.trim(),tm=$("mTime").value;if(!n||!tm||!formDays.length)return toast(L().fill);
  const st=$("mStock").value===""?"":Math.max(0,+$("mStock").value);
  const data={name:n,time:tm,dose:$("mDose").value.trim()||"1 tablet",food:$("mFood").value,days:formDays.slice(),stock:st};
  if(editId)Object.assign(S.meds.find(m=>m.id===editId),data);else S.meds.push({id:Date.now(),...data});
  resetForm();save();render();toast(L().tSaved)};
$("mCancel").onclick=()=>{resetForm();render()};
$("fAdd").onclick=()=>{const n=$("fName").value.trim(),p=$("fPhone").value.trim();if(!n||p.replace(/\D/g,"").length<10)return toast(L().fill);
  S.family.push({name:n,rel:$("fRel").value,phone:p,emergency:newEmerg});newEmerg=false;$("fName").value="";$("fPhone").value="";save();render();toast(L().tSaved)};
$("tManual").onclick=()=>{S.manualBtn=!S.manualBtn;save();render()};
$("sUser").onchange=e=>{S.user=e.target.value.trim()||"Papa";save();render()};
$("sDeadline").onchange=e=>{S.deadline=e.target.value||"10:00";save();render()};
$("sGrace").onchange=e=>{S.grace=+e.target.value;save();render()};
$("langSel").onchange=e=>{S.lang=e.target.value;save();render()};
$("sEsc").onchange=e=>{S.escHours=+e.target.value;save();render()};
$("tEmerg").onclick=()=>{newEmerg=!newEmerg;render()};
$("ff").onclick=()=>{S.offset+=3600000;save();render()};
$("rs").onclick=()=>{const lang=S.lang;S=defaults();S.lang=lang;selDay=0;resetForm();save();render()};
if(NATIVE){document.querySelector(".demo").classList.add("hidden");S.offset=0}
else if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
render();setInterval(render,20000);queueNotifs();
</script>
</body>
