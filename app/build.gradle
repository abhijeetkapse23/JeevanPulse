plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jeevanpulse.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.jeevanpulse.safety"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2"
    }

    signingConfigs {
        release {
            storeFile file("jeevanpulse.keystore")
            storePassword "jeevanpulse123"
            keyAlias "jeevanpulse"
            keyPassword "jeevanpulse123"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
