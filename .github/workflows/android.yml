name: Build Android app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Use private signing key (if set in repo secrets)
        env:
          JP_KEYSTORE_BASE64: ${{ secrets.JP_KEYSTORE_BASE64 }}
          JP_STORE_PASSWORD: ${{ secrets.JP_STORE_PASSWORD }}
          JP_KEY_ALIAS: ${{ secrets.JP_KEY_ALIAS }}
          JP_KEY_PASSWORD: ${{ secrets.JP_KEY_PASSWORD }}
        run: |
          if [ -n "$JP_KEYSTORE_BASE64" ]; then
            echo "$JP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "JP_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "JP_STORE_PASSWORD=$JP_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "JP_KEY_ALIAS=$JP_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "JP_KEY_PASSWORD=$JP_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the private key from secrets."
          else
            echo "::warning::No JP_KEYSTORE_BASE64 secret: signing with the old public key."
          fi

      - name: Build APK
        run: gradle assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|e: |What went wrong|> |Exception" build.log | grep -v "^> Task" | head -40 | tr '\n' ' ' | cut -c1-6000)
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk JeevanPulse.apk

      - name: Save APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: JeevanPulse-apk
          path: JeevanPulse.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JeevanPulse (latest build)
          make_latest: true
          body: |
            Latest JeevanPulse Android app, built automatically from the main branch.
            Download **JeevanPulse.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          files: JeevanPulse.apk
