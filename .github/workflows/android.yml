name: Build Android app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#FFF8EF' --splashBackgroundColor '#FFF8EF'

      - name: Allow exact reminder times
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' android/app/src/main/AndroidManifest.xml
          cat android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../JeevanPulse.apk

      - name: Save APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: JeevanPulse-apk
          path: JeevanPulse.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JeevanPulse (latest build)
          prerelease: false
          make_latest: true
          body: |
            Latest JeevanPulse Android app, built automatically from the main branch.
            Download **JeevanPulse.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          files: JeevanPulse.apk
