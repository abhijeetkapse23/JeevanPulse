name: Build Android app (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          msg=$(grep -E "error:|e: |What went wrong|> |Exception" build.log | grep -v "^> Task" | head -40 | tr '\n' ' ' | cut -c1-6000)
          echo "::error title=Build failed::$msg"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JeevanPulse.apk

      - name: Save APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: JeevanPulse-apk
          path: JeevanPulse.apk

      - name: Publish APK as a download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JeevanPulse (latest build)
          make_latest: true
          body: |
            Latest JeevanPulse Android app, built automatically from the main branch.
            Download **JeevanPulse.apk** on your Android phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
          files: JeevanPulse.apk
